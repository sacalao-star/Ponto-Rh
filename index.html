<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="PontoRH">
<meta name="apple-mobile-web-app-title" content="PontoRH">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d4ed8">
<title>PontoRH — Gestão de Equipe, Ponto & Fechamento</title>
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" defer></script>
<style>
:root{
  --bg:#f4f6fa;--card:#ffffff;--sub:#f8fafd;--tx:#0f172a;--mut:#5b667a;--bd:#e2e8f0;
  --ac:#1d4ed8;--ac2:#1e40af;--acs:#e8efff;--onac:#ffffff;
  --bad:#b42318;--bads:#fee4e2;
  --ok:#067647;--oks:#dcfae6;
  --warn:#b54708;--warns:#fef0c7;
  --mei:#6941c6;--meis:#f4ebff;
  --sh-sm:0 1px 2px rgba(15,23,42,0.04),0 1px 3px rgba(15,23,42,0.02);
  --sh-md:0 10px 25px -5px rgba(15,23,42,0.07),0 4px 10px -4px rgba(15,23,42,0.03);
  --sh-lg:0 24px 48px -12px rgba(15,23,42,0.26);
  --glass:rgba(255,255,255,0.92);
  --sidebar-bg:rgba(255,255,255,0.97);
  --header-h:58px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
:root[data-theme="dark"]{
  --bg:#0b0f17;--card:#131923;--sub:#1a2230;--tx:#e8edf5;--mut:#94a3b8;--bd:#253042;
  --ac:#6ea8fe;--ac2:#8bb9fe;--acs:#1a2b4c;--onac:#09111e;
  --bad:#f97066;--bads:#3a191b;
  --ok:#47cd89;--oks:#133124;
  --warn:#fdb022;--warns:#382611;
  --mei:#b692f6;--meis:#2c1c4d;
  --sh-sm:0 1px 3px rgba(0,0,0,0.25);
  --sh-md:0 10px 28px -6px rgba(0,0,0,0.45);
  --sh-lg:0 24px 54px -12px rgba(0,0,0,0.65);
  --glass:rgba(19,25,35,0.92);
  --sidebar-bg:rgba(19,25,35,0.98);
  color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:14.5px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease,color .25s ease
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:35;background:var(--card)}

/* =========================================================
   TELA DE ABERTURA NATIVA (SPLASH SCREEN ESTILO APP STORE)
   ========================================================= */
#app-splash{
  position:fixed;inset:0;z-index:100;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:48px 24px calc(36px + env(safe-area-inset-bottom,0px));
  transition:opacity .38s ease,visibility .38s ease;
}
#app-splash.hide{
  opacity:0;visibility:hidden;pointer-events:none;
}
.splash-center{
  display:flex;align-items:center;justify-content:center;gap:14px;
  animation:springModalIn .45s cubic-bezier(.16,1,.3,1) forwards;
}
.splash-logo{
  width:54px;height:54px;border-radius:15px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:var(--onac);display:grid;place-items:center;
  box-shadow:0 10px 24px color-mix(in srgb,var(--ac) 34%,transparent);
}
.splash-title{
  font-size:29px;font-weight:700;letter-spacing:-0.03em;color:var(--tx);
}
.splash-bottom{
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.splash-spinner{
  width:34px;height:34px;border-radius:50%;
  border:3.2px solid color-mix(in srgb,var(--ac) 20%,transparent);
  border-top-color:var(--ac);
  animation:spinRing .85s linear infinite;
}
@keyframes spinRing{to{transform:rotate(360deg)}}
.splash-ver{
  font-size:13px;font-weight:500;color:var(--mut);letter-spacing:0.01em;
}

/* =========================================================
   CONTROLE DE PERMISSÃO (ESPECTADOR vs ADMINISTRADOR)
   ========================================================= */
body.read-only-mode .admin-only{display:none !important}
body.admin-mode .viewer-only{display:none !important}
body.read-only-mode #point-table tr.cl,
body.read-only-mode .doc-row-item{cursor:default !important}
body.read-only-mode #point-table tr.cl:hover,
body.read-only-mode .doc-row-item:hover{background:transparent !important}

/* =========================================================
   CABEÇALHO PRINCIPAL (HAMBÚRGUER À ESQUERDA + MARCA CENTRAL + ACESSO)
   ========================================================= */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bd);
  transition:background-color .25s ease,border-color .25s ease
}
.top-bar{
  max-width:1100px;margin:0 auto;height:var(--header-h);
  padding:0 14px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
}
.top-left{display:flex;align-items:center;justify-content:flex-start}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.menu-toggle-btn{
  width:40px;height:40px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--tx);
  display:grid;place-items:center;cursor:pointer;
  transition:background-color .18s ease,border-color .18s ease,transform .15s ease
}
.menu-toggle-btn:hover{background:var(--sub);border-color:var(--bd)}
.menu-toggle-btn:active{transform:scale(0.94)}
.brand-center{
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.app-logo{
  width:35px;height:35px;border-radius:10px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:var(--onac);display:grid;place-items:center;
  box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 32%,transparent);
  flex:none;transition:transform .2s cubic-bezier(.34,1.56,.64,1)
}
.app-logo:hover{transform:scale(1.06) rotate(-4deg)}
.brand-center b{font-size:19.5px;letter-spacing:-0.025em}

.admin-access-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 10px;border-radius:99px;
  border:1px solid var(--bd);background:var(--sub);color:var(--mut);
  font:inherit;font-size:12px;font-weight:600;cursor:pointer;
  transition:all .18s ease;
}
.admin-access-pill:hover{
  border-color:var(--ac);color:var(--ac);background:var(--acs);
}

/* ABAS DE NAVEGAÇÃO */
.nav-strip{
  border-top:1px solid color-mix(in srgb,var(--bd) 65%,transparent);
  background:color-mix(in srgb,var(--card) 75%,transparent);
}
nav{
  max-width:1100px;margin:0 auto;padding:0 14px;
  position:relative;display:flex;overflow-x:auto;gap:4px;scrollbar-width:none
}
nav::-webkit-scrollbar{display:none}
nav button{
  position:relative;white-space:nowrap;border:0;background:none;color:var(--mut);
  padding:11px 14px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:color .2s ease
}
nav button:hover{color:var(--tx)}
nav button.on{color:var(--ac);font-weight:600}
.nav-ink{
  position:absolute;bottom:0;left:0;height:3px;border-radius:3px 3px 0 0;
  background:var(--ac);pointer-events:none;
  transition:transform .28s cubic-bezier(.22,1,.36,1),width .28s cubic-bezier(.22,1,.36,1)
}
.nav-cnt{
  background:var(--bads);color:var(--bad);font-size:11px;font-weight:700;
  padding:1px 6px;border-radius:99px
}

/* =========================================================
   ABA LATERAL (SIDEBAR DRAWER)
   ========================================================= */
.sidebar-backdrop{
  position:fixed;inset:0;z-index:38;
  background:rgba(9,13,22,0.34);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;
  transition:opacity .24s ease;
}
body.sidebar-open .sidebar-backdrop{opacity:1;pointer-events:auto}

.app-sidebar{
  position:fixed;
  top:calc(var(--header-h) + env(safe-area-inset-top,0px));
  left:0;bottom:0;
  width:282px;max-width:84vw;
  z-index:40;
  background:var(--sidebar-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-right:1px solid var(--bd);
  box-shadow:12px 0 36px rgba(15,23,42,0.12);
  padding:16px 14px 24px;
  display:flex;flex-direction:column;gap:6px;
  overflow-y:auto;
  transform:translateX(-104%);
  transition:transform .28s cubic-bezier(.22,1,.36,1),background-color .25s ease,border-color .25s ease;
}
body.sidebar-open .app-sidebar{transform:translateX(0)}

.sidebar-sync-card{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 12px;border-radius:11px;
  background:color-mix(in srgb,var(--ok) 8%,var(--sub));
  border:1px solid color-mix(in srgb,var(--ok) 25%,var(--bd));
  margin-bottom:8px;
  transition:background-color .2s ease,border-color .2s ease;
}
.sidebar-sync-card.err{
  background:color-mix(in srgb,var(--bad) 8%,var(--sub));
  border-color:color-mix(in srgb,var(--bad) 25%,var(--bd));
}
.sidebar-sync-card.syncing{
  background:color-mix(in srgb,var(--warn) 8%,var(--sub));
  border-color:color-mix(in srgb,var(--warn) 25%,var(--bd));
}
.sidebar-cloud-ico{flex:none;margin-top:2px;color:var(--ok)}
.sidebar-sync-card.err .sidebar-cloud-ico{color:var(--bad)}
.sidebar-sync-card.syncing .sidebar-cloud-ico{color:var(--warn)}
.sidebar-sync-text{font-size:12.5px;font-weight:600;line-height:1.35;color:var(--ok)}
.sidebar-sync-card.err .sidebar-sync-text{color:var(--bad)}
.sidebar-sync-card.syncing .sidebar-sync-text{color:var(--warn)}

.sidebar-sec-label{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  color:var(--mut);padding:8px 10px 2px;
}

.side-item{
  width:100%;display:flex;align-items:center;gap:11px;
  padding:11px 12px;border-radius:10px;
  border:1px solid transparent;background:transparent;color:var(--tx);
  font:inherit;font-size:14px;font-weight:500;text-align:left;cursor:pointer;
  transition:background-color .16s ease,color .16s ease,border-color .16s ease,transform .14s ease;
}
.side-item svg{flex:none;color:var(--mut);transition:color .16s ease}
.side-item:hover{
  background:var(--sub);border-color:var(--bd);color:var(--ac);transform:translateX(2px);
}
.side-item:hover svg{color:var(--ac)}
.side-item:active{transform:scale(0.98)}

.side-item.import-item:hover{
  background:color-mix(in srgb,var(--ok) 10%,var(--sub));
  border-color:color-mix(in srgb,var(--ok) 32%,var(--bd));
  color:var(--ok);
}
.side-item.import-item:hover svg{color:var(--ok)}

.side-item.export-item:hover{
  background:color-mix(in srgb,var(--ac) 10%,var(--sub));
  border-color:color-mix(in srgb,var(--ac) 32%,var(--bd));
  color:var(--ac);
}

.side-item.danger{margin-top:auto;color:var(--bad)}
.side-item.danger svg{color:var(--bad)}
.side-item.danger:hover{
  background:var(--bads);
  border-color:color-mix(in srgb,var(--bad) 30%,transparent);
  color:var(--bad);
}
.sidebar-divider{height:1px;background:var(--bd);margin:6px 4px}

/* MAIN LAYOUT & CARDS */
main{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.c{
  background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;
  box-shadow:var(--sh-sm);
  transition:box-shadow .22s ease,border-color .22s ease,transform .22s cubic-bezier(.22,1,.36,1),background-color .25s ease
}
.c-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.c-hd h2{margin:0}
h2{font-size:15.5px;font-weight:600;margin:0 0 10px;letter-spacing:-0.015em}
.m{color:var(--mut);font-size:13px;margin:0 0 8px}

/* MONTH BANNER */
.month-strip{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(135deg, color-mix(in srgb,var(--ac) 9%,var(--card)), color-mix(in srgb,var(--ok) 11%,var(--card)));
  border:1.5px solid color-mix(in srgb,var(--ac) 36%,var(--bd));
  border-radius:14px;
  padding:14px 18px;margin-bottom:14px;
  box-shadow:var(--sh-sm)
}
.month-strip-l{display:flex;align-items:center;gap:12px}
.live-dot{
  width:11px;height:11px;border-radius:50%;background:var(--ok);flex:none;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)
}
.month-title{font-size:17px;font-weight:700;letter-spacing:-0.015em}
.month-sub{font-size:12.5px;color:var(--mut);margin-top:2px}

.toolbar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:14px;
  box-shadow:var(--sh-sm)
}
.toolbar-grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* SELETOR SIMÉTRICO (NOME CENTRALIZADO E SETAS ABAIXO PARA OS LADOS) */
.emp-nav-card{
  background:var(--card);border:1px solid var(--bd);border-radius:13px;
  padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh-sm);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.emp-nav-top{
  width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
}
.emp-nav-select{
  width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:9px;
  background:var(--sub);color:var(--tx);font:inherit;font-size:14px;font-weight:600;
  text-align:center;text-align-last:center;cursor:pointer;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.emp-nav-select:focus{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 16%,transparent);
}
.emp-nav-arrows{
  width:100%;max-width:520px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
}
.emp-arrow-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 12px;border-radius:9px;
  border:1px solid color-mix(in srgb,var(--ac) 32%,var(--bd));
  background:var(--acs);color:var(--ac);
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:background-color .16s ease,color .16s ease,transform .14s ease;
}
.emp-arrow-btn:hover:not(:disabled){background:var(--ac);color:var(--onac)}
.emp-arrow-btn:active:not(:disabled){transform:scale(0.97)}
.emp-arrow-btn:disabled{opacity:0.45;cursor:not-allowed}

.inp, .sel-sm{
  padding:8px 11px;border:1px solid var(--bd);border-radius:8px;
  background:var(--sub);color:var(--tx);font:inherit;font-size:13px;
  transition:border-color .18s ease,box-shadow .18s ease
}
.inp:focus, .sel-sm:focus{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 16%,transparent)
}
.inp{min-width:190px}

/* KPI GRID */
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:14px}
@media(min-width:740px){.g{grid-template-columns:repeat(3,1fr)}}
.g .c{margin:0;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.g .c:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.k-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.k small{color:var(--mut);font-size:12px;font-weight:500}
.k b{display:block;font-size:25px;font-weight:700;margin:6px 0 3px;letter-spacing:-0.025em}
.k-sub{font-size:12px;color:var(--mut)}
.pos{color:var(--ok)!important}
.neg{color:var(--bad)!important}
.wrn{color:var(--warn)!important}

.grid-2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:840px){.grid-2{grid-template-columns:1.15fr 0.85fr}}

/* BADGES & BUTTONS */
.bd{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--acs);color:var(--ac)}
.bd.pe{background:var(--bads);color:var(--bad)}
.bd.ok{background:var(--oks);color:var(--ok)}
.bd.wn{background:var(--warns);color:var(--warn)}
.bd.mei{background:var(--meis);color:var(--mei)}

.alert-list{display:flex;flex-direction:column;gap:8px;max-height:310px;overflow-y:auto;padding-right:2px}
.alert-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--sub);
  transition:transform .18s ease,border-color .18s ease
}
.alert-item:hover{transform:translateX(2px);border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.alert-item.bad{border-left:4px solid var(--bad)}
.alert-item.warn{border-left:4px solid var(--warn)}
.alert-item.info{border-left:4px solid var(--ac)}
.alert-txt b{font-size:13.5px;display:block}
.alert-txt span{font-size:12.5px;color:var(--mut)}

.mini-btn{
  white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);
  padding:6px 11px;border-radius:8px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),background-color .16s ease,color .16s ease,border-color .16s ease
}
.mini-btn:hover{background:var(--ac);color:var(--onac);border-color:var(--ac);transform:translateY(-1px)}
.mini-btn:active{transform:scale(0.95)}
.mini-btn.pri{background:var(--acs);color:var(--ac);border-color:color-mix(in srgb,var(--ac) 35%,transparent)}
.mini-btn.pri:hover{background:var(--ac);color:var(--onac)}
.mini-btn.ok-q{background:var(--oks);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.mini-btn.ok-q:hover{background:var(--ok);color:#fff}
.mini-btn.bad-q{background:var(--bads);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.mini-btn.bad-q:hover{background:var(--bad);color:#fff}

.ftabs{display:flex;gap:6px;flex-wrap:wrap}
.ftab{
  border:1px solid var(--bd);background:var(--sub);color:var(--mut);
  padding:4px 10px;border-radius:99px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;
  transition:all .18s ease
}
.ftab:hover{color:var(--tx);border-color:var(--ac)}
.ftab.on{background:var(--acs);color:var(--ac);border-color:var(--ac);font-weight:600}

/* TABLES */
.w{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em}
.n{text-align:right}
.tn td,.tn th{text-align:center}
.pr{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.ab{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.cl{cursor:pointer;transition:background-color .16s ease}
tbody tr.cl:hover{background:var(--sub)}

@keyframes rowFlash{
  0%{background-color:color-mix(in srgb,var(--ok) 28%,transparent)}
  100%{background-color:transparent}
}
.row-flash{animation:rowFlash .75s cubic-bezier(.22,1,.36,1)}

/* BARS & GAUGES */
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);align-items:center}
.leg-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.bar-wrap{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.bar{
  display:block;height:8px;border-radius:4px;background:var(--ac);min-width:2px;
  transition:width .55s cubic-bezier(.22,1,.36,1)
}
.bar.r{background:var(--bad)}
.bar.g{background:var(--ok)}
.bar.w{background:var(--warn)}
.sr{margin-bottom:13px;padding-bottom:10px;border-bottom:1px dashed var(--bd)}
.sr:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
.sr-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;font-weight:500}
.sr small{color:var(--mut);font-weight:400}

/* EMPLOYEE CARDS & EXPANDED FICHA */
.hd{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hd-l{display:flex;gap:12px;align-items:center}
.av{
  flex:none;width:46px;height:46px;border-radius:12px;
  background:linear-gradient(135deg,var(--acs),color-mix(in srgb,var(--ac) 22%,var(--acs)));
  color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:16px
}
.team-card-expanded{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--bd);
  animation:fadeInBg .2s ease forwards;
}
dl{margin:0;display:grid;gap:8px}
dl div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--bd);padding-bottom:6px;font-size:13.5px}
dl div:last-child{border-bottom:0;padding-bottom:0}
dt{color:var(--mut)}dd{margin:0;text-align:right;font-weight:500}

.ficha-sec-title{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
  color:var(--ac);margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--bd)
}
.ficha-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.ficha-grid{grid-template-columns:1fr 1fr}}

.dr{
  display:flex;justify-content:space-between;align-items:center;padding:8px 8px;
  border-bottom:1px solid var(--bd);border-radius:7px;transition:background-color .16s ease
}
.dr:hover{background:var(--sub)}
.dr:last-child{border-bottom:0}

.att-upload-bar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  background:var(--sub);border:1px dashed var(--bd);border-radius:9px;padding:10px;margin-bottom:10px
}
.att-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sub);margin-bottom:6px
}
.att-item:last-child{margin-bottom:0}
.att-info{display:flex;flex-direction:column;gap:2px;min-width:160px;flex:1}
.att-actions{display:flex;gap:5px;flex-wrap:wrap}

.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  flex:1;min-width:150px;padding:11px 16px;border:0;border-radius:9px;
  background:var(--ac);color:var(--onac);font:inherit;font-weight:600;cursor:pointer;text-align:center;
  box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 25%,transparent);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),filter .16s ease
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:scale(0.97)}
.btn.s{background:var(--acs);color:var(--ac);box-shadow:none}
.btn.d{background:var(--bads);color:var(--bad);box-shadow:none}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--ok) 25%,transparent)}

.note-box{
  background:var(--sub);border:1px solid var(--bd);border-left:4px solid var(--mei);
  padding:10px 12px;border-radius:9px;font-size:12.5px;color:var(--mut);margin-top:10px
}

.cloud-box{
  background:var(--sub);border:1px solid var(--bd);border-radius:10px;
  padding:12px;margin-top:10px
}

/* RADIAL MEI GAUGE */
.mei-gauge-box{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  margin-top:14px;padding:14px;background:var(--sub);border-radius:10px;border:1px solid var(--bd)
}
.ring-wrap{position:relative;width:74px;height:74px;flex:none;display:grid;place-items:center}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-pct{position:absolute;font-size:13px;font-weight:700}

/* MONTHLY REPORT BOX */
.report-box{
  border:1.5px solid color-mix(in srgb,var(--ac) 35%,var(--bd));
  background:var(--card);border-radius:14px;padding:20px;margin-top:14px;
  box-shadow:var(--sh-md)
}
.report-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:2px solid var(--bd);margin-bottom:16px
}
.report-kpis{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px
}
@media(min-width:740px){.report-kpis{grid-template-columns:repeat(4,1fr)}}
.rk{
  background:var(--sub);border:1px solid var(--bd);border-radius:10px;padding:12px
}
.rk small{display:block;color:var(--mut);font-size:11.5px;font-weight:500}
.rk b{display:block;font-size:19px;font-weight:700;margin-top:3px}

/* MODALS */
.modal-bg{
  position:fixed;inset:0;background:rgba(9,13,22,0.55);backdrop-filter:blur(4px);z-index:55;
  display:flex;align-items:center;justify-content:center;padding:14px;
  animation:fadeInBg .2s ease forwards
}
@keyframes fadeInBg{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border:1px solid var(--bd);border-radius:14px;
  width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px;
  box-shadow:var(--sh-lg);
  animation:springModalIn .28s cubic-bezier(.16,1,.3,1) forwards
}
.modal.modal-narrow{max-width:420px}
.modal.modal-wide{max-width:860px}
@keyframes springModalIn{
  from{opacity:0;transform:translateY(14px) scale(0.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.modal h3{margin:0 0 4px;font-size:17px}
.modal-sec{
  grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.04em;color:var(--ac);margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)
}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fg .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fld input, .fld select{
  width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;
  background:var(--sub);color:var(--tx);font:inherit;font-size:13.5px
}

.admin-email-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sub);margin-bottom:6px;
}

/* TOAST NOTIFICATIONS */
#toast-stack{
  position:fixed;right:16px;bottom:16px;z-index:80;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:340px
}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;
  background:var(--card);color:var(--tx);border:1px solid var(--bd);
  border-left:4px solid var(--ok);border-radius:10px;padding:11px 14px;
  box-shadow:var(--sh-md);font-size:13px;font-weight:500;
  animation:toastIn .28s cubic-bezier(.16,1,.3,1) forwards
}
.toast.warn{border-left-color:var(--warn)}
@keyframes toastIn{
  from{opacity:0;transform:translateY(12px) scale(0.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.print-only{display:none}
.sg{display:flex;gap:24px;margin-top:36px}
.sg span{flex:1;border-top:1px solid var(--tx);padding-top:5px;text-align:center;font-size:12px}

@media print{
  .top,.app-sidebar,.sidebar-backdrop,.bt,.toolbar,.emp-nav-card,.month-strip,.no-print,select,body::before,.modal-bg,#toast-stack,#app-splash,.att-upload-bar,.att-actions{display:none!important}
  .print-only{display:block!important}
  body{background:#fff!important;color:#000!important;font-size:12.5px}
  main{max-width:100%;padding:0}
  .c,.report-box{background:#fff!important;color:#000!important;border:1px solid #cbd5e1!important;box-shadow:none!important;break-inside:avoid;margin-bottom:10px;padding:12px}
  .ficha-grid{grid-template-columns:1fr 1fr!important;gap:10px}

  .bd{border:1px solid #94a3b8!important;background:#f8fafc!important;color:#0f172a!important}
}
</style>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {

} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// =========================================================

// =========================================================
const firebaseConfig = {
  apiKey: "AIzaSyAUGhueUhaTL2QYipgo_uJva3yaZCAbxXI",
  authDomain: "pontorh-usija.firebaseapp.com",
  projectId: "pontorh-usija",
  storageBucket: "pontorh-usija.firebasestorage.app",
  messagingSenderId: "376051277351",
  appId: "1:376051277351:web:2927a59785442e3d32f802"
};

const MASTER_ADMIN_EMAIL = "sacalao660@gmail.com";
let AUTHORIZED_ADMINS = [MASTER_ADMIN_EMAIL];

const firebaseApp = initializeApp(firebaseConfig);
let firebaseAuth = null;
try {
  firebaseAuth = initializeAuth(firebaseApp, {
    persistence: [indexedDBLocalPersistence, browserLocalPersistence, inMemoryPersistence]
  });
} catch (_) {
  try {
    firebaseAuth = initializeAuth(firebaseApp, { persistence: inMemoryPersistence });
  } catch (__) {}
}
const db = getFirestore(firebaseApp);

const CLIENT_ID = "cli_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36);
const UNIFIED_STORAGE_KEY = "pontoRH_unified_v7_data";
const ADMIN_SESSION_KEY = "pontoRH_admin_session_v7";
const UI_NAV_STATE_KEY = "pontoRH_nav_state_v7";
const LEGACY_KEYS = ["pontoRH_v6_data", "pontoRH_v5_mei_data", "pontoRH_v4_mei_data"];
const MEI_ANNUAL_LIMIT = 81000;

let IS_ADMIN = false;
let IS_READ_ONLY = true;
let LOGGED_ADMIN_EMAIL = "";
let CLOUD_INITIALIZED = false;

// =========================================================
// SPLASH SCREEN & SERVICE WORKER PWA
// =========================================================
function hideSplashScreen() {
  const splash = document.getElementById("app-splash");
  if (splash && !splash.classList.contains("hide")) {
    splash.classList.add("hide");
    setTimeout(() => splash.remove(), 420);
  }
}

if ("serviceWorker" in navigator && (window.location.protocol === "https:" || window.location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById("btn-install-app");
  if (btn) {
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Instalar App Agora</span>`;
  }
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  MotionFX.toast("PontoRH instalado como aplicativo!");
});

// =========================================================
// CONTROLE DA ABA LATERAL & MODO DE ACESSO
// =========================================================
function toggleSidebar() {
  const open = document.body.classList.toggle("sidebar-open");
  const btn = document.getElementById("sidebar-toggle-btn");
  if (btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
}

function closeSidebar() {
  document.body.classList.remove("sidebar-open");
  const btn = document.getElementById("sidebar-toggle-btn");
  if (btn) btn.setAttribute("aria-expanded", "false");
}

function isEmailAuthorizedAdmin(email) {
  const clean = String(email || "").trim().toLowerCase();
  if (!clean) return false;
  return clean === MASTER_ADMIN_EMAIL || AUTHORIZED_ADMINS.includes(clean);
}

function setAccessMode({ isAdmin, email = "" }) {
  IS_ADMIN = !!isAdmin;
  IS_READ_ONLY = !IS_ADMIN;
  LOGGED_ADMIN_EMAIL = IS_ADMIN ? String(email || "").trim().toLowerCase() : "";

  if (IS_ADMIN) {
    document.body.classList.remove("read-only-mode");
    document.body.classList.add("admin-mode");
    try {
      localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ email: LOGGED_ADMIN_EMAIL, at: Date.now() }));
    } catch (_) {}
  } else {
    document.body.classList.remove("admin-mode");
    document.body.classList.add("read-only-mode");
    try { localStorage.removeItem(ADMIN_SESSION_KEY); } catch (_) {}
  }
  updateHeaderSyncUI();

async function loginWithEmailForm() {
  if (!firebaseAuth) return;
  const email = (document.getElementById("login-email")?.value || "").trim().toLowerCase();
  const pass = document.getElementById("login-pass")?.value || "";
  const errBox = document.getElementById("login-modal-err");
  const btn = document.getElementById("login-submit-btn");

  const showErr = (msg) => {
    if (!errBox) return;
    errBox.textContent = msg;
    errBox.style.display = "block";
  };

  if (!email || !pass) return;
  if (!isEmailAuthorizedAdmin(email)) {
    showErr(`O e-mail "${email}" não está na lista de administradores autorizados.`);
    return;
  }

  if (errBox) errBox.style.display = "none";
  if (btn) { btn.disabled = true; btn.textContent = "Entrando..."; }

  try {
    await signInWithEmailAndPassword(firebaseAuth, email, pass);
    setAccessMode({ isAdmin: true, email });
    closeModal();
    go({ animate: false });
    MotionFX.toast("Modo Administrador ativado!");
  } catch (err) {
    const code = err?.code || "";
    let msg = "Não foi possível entrar. Verifique e-mail e senha.";
    if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
      msg = "E-mail ou senha incorretos.";
    } else if (code === "auth/too-many-requests") {
      msg = "Muitas tentativas. Aguarde alguns instantes.";
    } else if (code === "auth/network-request-failed") {
      msg = "Sem conexão com a internet.";
    }
    showErr(msg);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Entrar como Admin"; }
  }
}

async function logoutAdmin() {
  setAccessMode({ isAdmin: false });
  if (firebaseAuth) {
    try { await signOut(firebaseAuth); } catch (_) {}
  }
  go({ animate: false });
  MotionFX.toast("Você voltou ao modo Espectador (somente leitura).", "warn");
}

async function addAdminEmail() {
  if (!IS_ADMIN) return;
  const inp = document.getElementById("new-admin-email");
  const email = String(inp?.value || "").trim().toLowerCase();
  if (!email || !email.includes("@")) {
    alert("Digite um e-mail válido.");
    return;
  }
  const nextList = Array.from(new Set([MASTER_ADMIN_EMAIL, ...AUTHORIZED_ADMINS, email]));
  AUTHORIZED_ADMINS = nextList;
  try {
    await setDoc(doc(db, "pontorh_config", "geral"), {
      admins: nextList,
      updatedAt: Date.now(),
      updatedBy: CLIENT_ID
    }, { merge: true });
    openManageAdminsModal();
    MotionFX.toast(`Administrador ${email} adicionado!`);
  } catch (err) {
    alert("Erro ao salvar no Firestore. Verifique as regras de segurança.");
  }
}

async function removeAdminEmail(email) {
  if (!IS_ADMIN || email === MASTER_ADMIN_EMAIL) return;
  if (!confirm(`Remover permissão de administrador de ${email}?`)) return;
  const nextList = AUTHORIZED_ADMINS.filter(e => e !== email);
  if (!nextList.includes(MASTER_ADMIN_EMAIL)) nextList.unshift(MASTER_ADMIN_EMAIL);
  AUTHORIZED_ADMINS = nextList;
  try {
    await setDoc(doc(db, "pontorh_config", "geral"), {
      admins: nextList,
      updatedAt: Date.now(),
      updatedBy: CLIENT_ID
    }, { merge: true });
    openManageAdminsModal();
    MotionFX.toast(`Administrador ${email} removido.`, "warn");
  } catch (err) {
    alert("Erro ao atualizar no Firestore.");
  }
}

const MotionFX = {
  toast(msg, type = "ok") {
    const stack = $("#toast-stack");
    if (!stack) return;
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    const icon = type === "warn"
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    el.innerHTML = `${icon}<span>${msg}</span>`;
    stack.appendChild(el);
    setTimeout(() => {
      el.style.transition = "opacity .25s ease, transform .25s ease";
      el.style.opacity = "0";
      el.style.transform = "translateY(8px) scale(0.96)";
      setTimeout(() => el.remove(), 260);
    }, 2800);
  },

  staggerCards(selector = "main .g .c, main > .c, main .grid-2 > .c, main .ficha-grid > .c") {
    const els = $$all(selector);
    if (!els.length) return;
    if (window.anime) {
      window.anime({
        targets: els,
        opacity: [0, 1],
        translateY: [10, 0],
        duration: 320,
        delay: window.anime.stagger(30),
        easing: "easeOutCubic"
      });
    } else {
      els.forEach((el, i) => {
        el.animate(
          [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "translateY(0)" }],
          { duration: 280, delay: Math.min(i * 25, 200), easing: "cubic-bezier(.22,1,.36,1)", fill: "both" }
        );
      });
    }
  },

  countNumbers() {
    $$all("[data-count]").forEach(el => {
      const target = parseFloat(el.getAttribute("data-count"));
      const fmt = el.getAttribute("data-fmt") || "int";
      if (isNaN(target)) return;
      const startTime = performance.now();
      const duration = 400;
      const step = now => {
        const p = Math.min(1, (now - startTime) / duration);
        const ease = 1 - Math.pow(1 - p, 3);
        const cur = target * ease;
        if (fmt === "brl") el.textContent = $$(cur);
        else if (fmt === "hm") el.textContent = hm(Math.round(cur));
        else if (fmt === "shm") {
          const v = Math.round(cur);
          el.textContent = (v > 0 ? "+" : "") + hm(v);
        } else el.textContent = Math.round(cur);
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  },

  updateNavInk() {
    const nav = $("#nav");
    const activeBtn = nav?.querySelector("button.on");
    let ink = nav?.querySelector(".nav-ink");
    if (!nav || !activeBtn) return;
    if (!ink) {
      ink = document.createElement("span");
      ink.className = "nav-ink";
      nav.appendChild(ink);
    }
    ink.style.width = activeBtn.offsetWidth + "px";
    ink.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
  },

  flashRows(selector) {
    requestAnimationFrame(() => {
      $$all(selector).forEach((el, i) => {
        setTimeout(() => {
          el.classList.remove("row-flash");
          void el.offsetWidth;
          el.classList.add("row-flash");
        }, i * 22);
      });
    });
  }
};

function formatMonthLabel(comp) {
  const [yr, mo] = comp.split("-").map(Number);
  const nome = NOMES_MESES[(mo || 1) - 1] || "Mês";
  return `${nome} de ${yr}`;
}

function isHoliday(comp, d) {
  const [, mo] = comp.split("-").map(Number);
  if (mo === 1 && d === 1) return "Feriado (Confraternização)";
  if (mo === 4 && d === 21) return "Feriado (Tiradentes)";
  if (mo === 5 && d === 1) return "Feriado (Dia do Trabalho)";
  if (mo === 9 && d === 7) return "Feriado (Independência)";
  if (mo === 10 && d === 12) return "Feriado (N. Sra. Aparecida)";
  if (mo === 11 && d === 2) return "Feriado (Finados)";
  if (mo === 11 && d === 15) return "Feriado (Proclamação República)";
  if (mo === 11 && d === 20) return "Feriado (Consciência Negra)";
  if (mo === 12 && d === 25) return "Feriado (Natal)";
  return null;
}

function generateMonthRows(empId, comp, isDemoSeed = false) {
  const [yr, mo] = comp.split("-").map(Number);
  const daysInMonth = new Date(yr, mo, 0).getDate();
  const maxDay = isDemoSeed ? ((comp === CURRENT_MONTH) ? 17 : daysInMonth) : 0;
  const numSeed = typeof empId === "number" ? empId : Array.from(String(empId)).reduce((a, c) => a + c.charCodeAt(0), 0);
  const r = R(numSeed * 977 + mo * 31 + 13);
  const rows = [];

  for (let d = 1; d <= daysInMonth; d++) {
    const w = new Date(yr, mo - 1, d).getDay();
    const hol = isHoliday(comp, d);
    const row = { d, w, obs: "" };

    if (w === 0 || w === 6) {
      row.t = "Folga";
    } else if (hol) {
      row.t = hol;
    } else if (d > maxDay) {
      row.t = "—";
    } else {
      const e = 480 + Math.round(r() * 17 - 5);
      const a = 720 + Math.round(r() * 10 - 4);
      const v = a + 60 + Math.round(r() * 8);
      const s = 1020 + Math.round(r() * 52 - 10);
      const miss = r() < 0.05;
      row.p = [e, a, v, miss ? null : s];
      row.t = miss ? "Pendente" : "Normal";
    }
    rows.push(row);
  }
  return rows;
}

function normalizeStateShape(parsed) {
  if (!parsed || !Array.isArray(parsed.employees) || !parsed.points) return null;
  const seenIds = new Set();
  parsed.employees = parsed.employees.map((emp, idx) => {
    let empId = emp.id != null ? emp.id : (idx + 1);
    while (seenIds.has(String(empId))) {
      empId = Number(empId) + 1 || (idx + 100);
    }
    seenIds.add(String(empId));

    return {
      id: empId,
      uid: emp.uid || generateEmpUid(),
      n: emp.n ?? "",
      regime: emp.regime || "MEI",
      cnpjMei: emp.cnpjMei ?? "",
      banco: emp.banco ?? "",
      pix: emp.pix ?? "",
      s: emp.s ?? "Administrativo",
      c: emp.c ?? "",
      ad: emp.ad ?? "",
      sal: emp.sal != null ? Number(emp.sal) : 1800,
      jornada: emp.jornada ?? "44h semanais (Seg a Sex)",
      horaEntrada: emp.horaEntrada ?? "08:00",
      horaSaida: emp.horaSaida ?? "17:00",
      fatorHe: emp.fatorHe != null ? Number(emp.fatorHe) : 1.0,
      ajudaCusto: emp.ajudaCusto != null ? Number(emp.ajudaCusto) : 0,
      acumAnual: emp.acumAnual != null ? Number(emp.acumAnual) : 0,
      cpf: emp.cpf ?? "",
      rg: emp.rg ?? "",
      cnh: emp.cnh ?? "",
      cnhCat: emp.cnhCat ?? "",
      nasc: emp.nasc ?? "",
      nacionalidade: emp.nacionalidade ?? "Brasileira",
      naturalidade: emp.naturalidade ?? "Rio de Janeiro",
      estadoCivil: emp.estadoCivil ?? "Solteiro(a)",
      tel: emp.tel ?? "",
      email: emp.email ?? "",
      endereco: emp.endereco ?? "",
      numero: emp.numero ?? "",
      complemento: emp.complemento ?? "",
      bairro: emp.bairro ?? "",
      cidade: emp.cidade ?? "Rio de Janeiro",
      uf: emp.uf ?? "RJ",
      cep: emp.cep ?? "",
      emergNome: emp.emergNome ?? "",
      emergParentesco: emp.emergParentesco ?? "",
      emergTel: emp.emergTel ?? "",
      dep: emp.dep != null ? Number(emp.dep) : 0,
      vt: emp.vt != null ? Number(emp.vt) : 0,
      status: emp.status ?? "Ativo",
      docs: Array.isArray(emp.docs) ? [...emp.docs] : [false, false, false, false, false],
      attachments: Array.isArray(emp.attachments)
        ? emp.attachments.map(att => ({ ...att }))
        : []
    };
  });
  if (!parsed.updatedAt) parsed.updatedAt = Date.now();
  return parsed;
}

function createDefaultState() {
  const employees = INITIAL_EMP.map((emp, idx) =>
    createIsolatedEmployee({
      ...emp,
      docs: [true, true, emp.id % 4 !== 0, true, true],
      attachments: []
    }, INITIAL_EMP.slice(0, idx))
  );
  const seedMonths = ["2026-09", "2026-10", CURRENT_MONTH];
  const points = {};
  seedMonths.forEach(comp => {
    points[comp] = {};
    employees.forEach(emp => {
      points[comp][emp.id] = generateMonthRows(emp.id, comp, true);
    });
  });
  return { employees, points, updatedAt: 1 };
}

function loadLocalCache() {
  try {
    let raw = localStorage.getItem(UNIFIED_STORAGE_KEY);
    if (!raw) {
      for (const k of LEGACY_KEYS) {
        raw = localStorage.getItem(k);
        if (raw) break;
      }
    }
    if (raw) {
      const normalized = normalizeStateShape(JSON.parse(raw));
      if (normalized) return normalized;
    }
  } catch (_) {}
  return createDefaultState();
}

function connectUnifiedCloudListeners() {
  if (CLOUD_INITIALIZED) return;
  CLOUD_INITIALIZED = true;

  // 1. Escuta em tempo real da lista de administradores autorizados
  onSnapshot(doc(db, "pontorh_config", "geral"), (snap) => {
    if (snap.exists() && Array.isArray(snap.data()?.admins)) {
      AUTHORIZED_ADMINS = Array.from(new Set([MASTER_ADMIN_EMAIL, ...snap.data().admins.map(e => String(e).toLowerCase())]));
      if (firebaseAuth?.currentUser && !firebaseAuth.currentUser.isAnonymous) {
        const curEmail = (firebaseAuth.currentUser.email || "").toLowerCase();
        if (isEmailAuthorizedAdmin(curEmail) && !IS_ADMIN) {
          setAccessMode({ isAdmin: true, email: curEmail });
          go({ animate: false });
        }
      }
    }
  }, () => {});

  // 2. Escuta em tempo real de TODOS os colaboradores (1 doc por pessoa = 1 MB cada!)
  onSnapshot(collection(db, "pontorh_colaboradores"), (snapshot) => {
    SYNC_META.cloudStatus = "synced";
    SYNC_META.cloudError = "";
    SYNC_META.lastSyncTime = new Date();
    updateHeaderSyncUI();

    if (snapshot.empty) {
      if (IS_ADMIN) {
        syncAllToCloud();
      }
      hideSplashScreen();
      return;
    }

    const cloudEmps = [];
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      if (data && data.n) {
        cloudEmps.push(data);
      }
    });

    if (cloudEmps.length > 0) {
      cloudEmps.sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0));
      const normalized = normalizeStateShape({ employees: cloudEmps, points: STATE.points, updatedAt: Date.now() });
      if (normalized) {
        STATE.employees = normalized.employees;
        if (!STATE.employees.some(x => String(x.id) === String(E))) {
          E = STATE.employees[0]?.id || 1;
        }
        saveLocalCache();
        go({ animate: false });
      }
    }
    hideSplashScreen();
  }, (err) => {
    console.warn("Erro listener colaboradores:", err);
    SYNC_META.cloudStatus = "error";
    SYNC_META.cloudError = err?.code || "Verificar Regras do Firestore";
    updateHeaderSyncUI();
    hideSplashScreen();
  });

  // 3. Escuta em tempo real dos espelhos de horas por competência
  onSnapshot(collection(db, "pontorh_pontos"), (snapshot) => {
    if (snapshot.empty) {
      if (IS_ADMIN) {
        for (const comp of Object.keys(STATE.points || {})) {
          syncMonthPointsToCloud(comp);
        }
      }
      return;
    }

    let changed = false;
    snapshot.forEach(docSnap => {
      const d = docSnap.data();
      if (d && d.comp && d.dataJson && d.updatedBy !== CLIENT_ID) {
        try {
          STATE.points[d.comp] = JSON.parse(d.dataJson);
          changed = true;
        } catch (_) {}
      }
    });

    if (changed) {
      saveLocalCache();
      go({ animate: false });
    }
  }, () => {});
}

function ensureMonthData(comp) {
  if (!STATE.points[comp]) STATE.points[comp] = {};
  STATE.employees.forEach(emp => {
    if (!STATE.points[comp][emp.id]) {
      const isSeedPast = (comp === "2026-09" || comp === "2026-10");
      STATE.points[comp][emp.id] = generateMonthRows(emp.id, comp, isSeedPast);
    }
  });
}

function calcMetrics(emp, comp) {
  ensureMonthData(comp);
  const rows = STATE.points[comp][emp.id] || [];
  let ex = 0, ng = 0, at = 0, pe = 0, ok = 0;

  rows.forEach(row => {
    row.df = 0;
    if (row.t === "Normal" && row.p) {
      const [e, a, v, s] = row.p;
      if (e == null || a == null || v == null || s == null) {
        row.t = "Pendente";
        pe++;
      } else {
        let df = (a - e) + (s - v) - 480;
        if (Math.abs(df) <= 10) df = 0;
        row.df = df;
        if (df > 0) ex += df;
        else if (df < 0) ng += Math.abs(df);
        if (e - 480 > 10) at += (e - 480);
        ok++;
      }
    } else if (row.t === "Pendente") {
      pe++;
    } else if (row.t === "Falta") {
      row.df = -480;
      ng += 480;
      ok++;
    } else if (row.t === "Abonado" || row.t === "Folga Comp.") {
      row.df = 0;
      ok++;
    }
  });

  const isMEI = emp.regime === "MEI";
  const vh = emp.sal / 220;
  const fator = isMEI ? (emp.fatorHe || 1.0) : 1.5;
  const exVal = (ex / 60) * vh * fator;
  const ngVal = (ng / 60) * vh;
  const ajuda = isMEI ? (emp.ajudaCusto || 0) : 0;

  if (isMEI) {
    const totalNF = Math.max(0, emp.sal + exVal - ngVal + ajuda);
    const acumProjetado = (emp.acumAnual || 0) + totalNF;
    const pctTeto = (acumProjetado / MEI_ANNUAL_LIMIT) * 100;
    return {
      isMEI: true, rows, ex, ng, at, pe, ok, vh, fator,
      exVal, ngVal, ajuda, bruto: totalNF,
      inss: 0, irrf: 0, vtVal: 0, descontos: ngVal,
      liquido: totalNF, fgts: 0, acumProjetado, pctTeto
    };
  } else {
    const bruto = Math.max(0, emp.sal + exVal - ngVal);
    let inss = 0, prev = 0;
    for (const [teto, aliq] of INSS) {
      if (bruto > prev) inss += (Math.min(bruto, teto) - prev) * aliq;
      prev = teto;
    }
    const baseIR = bruto - inss - (emp.dep || 0) * 189.59;
    const faixaIR = IR.find(x => baseIR <= x[0]) || IR[IR.length - 1];
    const irrf = Math.max(0, baseIR * faixaIR[1] - faixaIR[2]);
    const vtVal = emp.vt ? emp.sal * 0.06 : 0;
    const descontos = ngVal + inss + irrf + vtVal;
    const liquido = Math.max(0, (emp.sal + exVal) - descontos);
    const fgts = (emp.sal + exVal) * 0.08;
    return {
      isMEI: false, rows, ex, ng, at, pe, ok, vh, fator: 1.5,
      exVal, ngVal, ajuda: 0, bruto: emp.sal + exVal,
      inss, irrf, vtVal, descontos, liquido, fgts,
      acumProjetado: 0, pctTeto: 0
    };
  }
}

        alerts.push({

          desc: `${falta} (${emp.s})`,
          actionLabel: "Ir ao Ponto", onClick: `ir(${emp.id}, 'ponto')`
        });
      }
    });
  });

  STATE.employees.forEach(emp => {
    const m = allMetrics[emp.id];
    if (emp.regime === "MEI") {
      if (!emp.cnpjMei || emp.cnpjMei.trim().length < 10) {
        alerts.push({
          type: "mei", sev: "bad", badge: "CNPJ MEI Pendente", bClass: "pe",
          title: `${emp.n} — Cadastro MEI incompleto`,
          desc: "Informe o CNPJ do MEI na Ficha para emissão de NFS-e.",
          actionLabel: "Ver Ficha", onClick: `openEmployeeInTeam(${emp.id})`
        });
      }
      if (m.pctTeto >= 80) {
        alerts.push({
          type: "mei", sev: m.pctTeto >= 100 ? "bad" : "warn",
          badge: m.pctTeto >= 100 ? "Teto MEI Excedido" : `Teto MEI (${m.pctTeto.toFixed(0)}%)`,
          bClass: m.pctTeto >= 100 ? "pe" : "wn",
          title: `${emp.n} — Acumulado ${$$(m.acumProjetado)}`,
          desc: `Limite anual MEI é ${$$(MEI_ANNUAL_LIMIT)}.`,
          actionLabel: "Ver NF", onClick: `ir(${emp.id}, 'holerite')`
        });
      }
    }
  });

  STATE.employees.forEach(emp => {
    const docList = emp.regime === "MEI" ? DOC_MEI : DOC_CLT;
    const missing = docList.filter((_, idx) => !emp.docs[idx]);
    if (missing.length > 0) {
      alerts.push({
        type: "doc", sev: "warn", badge: `${missing.length} Doc. Pendente`, bClass: "wn",
        title: `${emp.n} (${emp.regime})`,
        desc: `Falta: ${missing.join(", ")}`,
        actionLabel: "Ver Ficha", onClick: `openEmployeeInTeam(${emp.id})`
      });
    }
  });

  return alerts;
}

function go(opts = {}) {
  const { animate = true } = opts;
  const activeSearch = document.activeElement?.id === "emp-search";
  const selStart = activeSearch ? document.activeElement.selectionStart : null;
  const selEnd = activeSearch ? document.activeElement.selectionEnd : null;

  ensureMonthData(CURRENT_MONTH);
  const allMetrics = {};
  let totalPending = 0;
  STATE.employees.forEach(emp => {
    allMetrics[emp.id] = calcMetrics(emp, CURRENT_MONTH);
    totalPending += allMetrics[emp.id].pe;
  });

  // Aba "Fichas" removida pois todas as fichas completas já abrem dentro da aba "Equipe"
  const NAV = [
    ["painel", "Painel", totalPending],
    ["equipe", "Equipe", 0],

    ["holerite", "Fechamento / NF", 0],
    ["passados", "Meses Passados", 0]
  ];

  if (!NAV.some(n => n[0] === V)) V = "painel";

  const existingInk = $("#nav .nav-ink");
  $("#nav").innerHTML = NAV.map(n =>
    `<button class="${n[0] === V ? "on" : ""}" onclick="ir(0,'${n[0]}')">
      ${n[1]}${n[2] > 0 ? `<span class="nav-cnt">${n[2]}</span>` : ""}
    </button>`
  ).join("");
  if (existingInk) $("#nav").appendChild(existingInk);

  $("#v").innerHTML = ({ painel, equipe, ponto, holerite, passados })[V](allMetrics);

    if (inp) {
      inp.focus();

    }
  } else if (animate) {
    MotionFX.staggerCards();
    MotionFX.countNumbers();
  }
}

function painel(allMetrics) {
  const emps = STATE.employees;
  const meiCount = emps.filter(e => e.regime === "MEI").length;
  const cltCount = emps.length - meiCount;

  const sum = key => emps.reduce((acc, e) => acc + allMetrics[e.id][key], 0);
  const totEx = sum("ex");
  const totExVal = sum("exVal");
  const totNg = sum("ng");
  const totAt = sum("at");
  const totPe = sum("pe");
  const totOk = sum("ok");
  const totPagarMEI = emps.filter(e => e.regime === "MEI").reduce((a, e) => a + allMetrics[e.id].liquido, 0);
  const totPagarCLT = emps.filter(e => e.regime !== "MEI").reduce((a, e) => a + allMetrics[e.id].liquido, 0);
  const totGeral = totPagarMEI + totPagarCLT;
  const saldoGeral = totEx - totNg;

  const allAlerts = getDashboardAlerts(CURRENT_MONTH, allMetrics);
  const filteredAlerts = UI.alertFilter === "todos"
    ? allAlerts
    : allAlerts.filter(a => a.type === UI.alertFilter);

  const sectors = [...new Set(emps.map(e => e.s))];
  const sectorStats = sectors.map(s => {
    const group = emps.filter(e => e.s === s);
    const eMin = group.reduce((a, e) => a + allMetrics[e.id].ex, 0);
    const nMin = group.reduce((a, e) => a + allMetrics[e.id].ng, 0);
    const custo = group.reduce((a, e) => a + allMetrics[e.id].liquido, 0);
    return { s, eMin, nMin, saldo: eMin - nMin, custo, count: group.length };
  });
  const maxBar = Math.max(...sectorStats.map(x => Math.max(x.eMin, x.nMin)), 1);
  const totRegistros = Math.max(totOk + totPe, 1);

  let rowsEmp = emps.filter(emp => {
    const matchSearch = emp.n.toLowerCase().includes(UI.search.toLowerCase()) ||
                        emp.c.toLowerCase().includes(UI.search.toLowerCase());
    const matchSector = UI.sectorFilter === "TODOS" || emp.s === UI.sectorFilter;

function formatFileSize(bytes) {
  if (!bytes || bytes < 1024) return `${bytes || 0} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

function compressImageToDataUrl(file, maxDim = 1280, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
        const approxBytes = Math.round((compressedDataUrl.length * 3) / 4);
        resolve({ dataUrl: compressedDataUrl, mimeType: "image/jpeg", sizeBytes: approxBytes });
      };
      img.onerror = () => reject(new Error("Não foi possível processar a imagem."));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error("Erro ao ler o arquivo de imagem."));
    reader.readAsDataURL(file);
  });
}

function readPdfAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const dataUrl = ev.target.result;
      const approxBytes = Math.round((dataUrl.length * 3) / 4);
      resolve({ dataUrl, mimeType: "application/pdf", sizeBytes: approxBytes });
    };
    reader.onerror = () => reject(new Error("Erro ao ler o arquivo PDF."));
    reader.readAsDataURL(file);
  });
}

async function handleAttachmentUpload(empId, inputEl) {
  if (!IS_ADMIN) return;
  const file = inputEl?.files?.[0];
  if (!file) return;

  const emp = STATE.employees.find(x => String(x.id) === String(empId));
  if (!emp) return;

  const typeSel = document.getElementById(`att-type-${emp.id}`);
  const docType = typeSel ? typeSel.value : "Outro Documento";

  try {
    let processed;
    if (file.type.startsWith("image/")) {
      processed = await compressImageToDataUrl(file, 1280, 0.72);
    } else if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
      if (file.size > 750 * 1024) {
        alert("Este PDF ultrapassa 750 KB. Para manter a sincronização instantânea na nuvem, anexe um PDF de até 750 KB ou uma foto/imagem do documento (comprimida automaticamente).");
        inputEl.value = "";
        return;
      }
      processed = await readPdfAsDataUrl(file);
    } else {
      alert("Formato não suportado. Selecione um PDF ou uma imagem (JPG, PNG, WEBP).");
      inputEl.value = "";
      return;
    }

    if (!Array.isArray(emp.attachments)) emp.attachments = [];
    emp.attachments.push({
      id: "att_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6),
      docType,
      fileName: file.name,
      mimeType: processed.mimeType,
      sizeLabel: formatFileSize(processed.sizeBytes),
      uploadedAt: new Date().toLocaleDateString("pt-BR"),
      dataUrl: processed.dataUrl
    });

    const lowerType = docType.toLowerCase();
    const docList = emp.regime === "MEI" ? DOC_MEI : DOC_CLT;
    docList.forEach((label, idx) => {
      const l = label.toLowerCase();
      if ((lowerType.includes("rg") || lowerType.includes("cpf") || lowerType.includes("cnh")) && (l.includes("rg") || l.includes("cpf") || l.includes("cnh"))) {
        emp.docs[idx] = true;
      } else if ((lowerType.includes("ccmei") || lowerType.includes("contrato")) && (l.includes("contrato") || l.includes("ccmei"))) {
        emp.docs[idx] = true;
      } else if (lowerType.includes("aso") && l.includes("aso")) {
        emp.docs[idx] = true;
      } else if (lowerType.includes("ctps") && l.includes("ctps")) {
        emp.docs[idx] = true;
      } else if (lowerType.includes("residência") && l.includes("residência")) {
        emp.docs[idx] = true;
      } else if (lowerType.includes("certidão") && l.includes("certidão")) {
        emp.docs[idx] = true;
      } else if (lowerType.includes("bancário") && l.includes("bancário")) {
        emp.docs[idx] = true;
      }
    });

    saveLocalCache();
    await syncSingleEmployeeToCloud(emp);
    go({ animate: false });
    MotionFX.toast(`${docType} anexado e sincronizado!`);
  } catch (err) {
    alert(err?.message || "Não foi possível anexar o documento.");
  } finally {
    if (inputEl) inputEl.value = "";
  }
}

function previewAttachment(empId, attId) {
  const emp = STATE.employees.find(x => String(x.id) === String(empId));
  const att = emp?.attachments?.find(a => a.id === attId);
  if (!att) return;

  const isPdf = att.mimeType === "application/pdf" || String(att.dataUrl).startsWith("data:application/pdf");
  $("#modal-root").innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal modal-wide">
      <div class="c-hd" style="margin-bottom:8px">
        <div>
          <h3>${escHtml(att.docType)} — ${escHtml(emp.n)}</h3>
          <p class="m" style="margin:2px 0 0">${escHtml(att.fileName)} • ${escHtml(att.sizeLabel || "")} • Anexado em ${escHtml(att.uploadedAt || "—")}</p>
        </div>
        <span class="bd ok">${isPdf ? "PDF" : "Imagem"}</span>
      </div>
      <div style="background:var(--sub);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center">
        ${isPdf
          ? `<iframe src="${att.dataUrl}" style="width:100%;height:68vh;border:0;border-radius:6px" title="${escHtml(att.fileName)}"></iframe>`
          : `<img src="${att.dataUrl}" alt="${escHtml(att.docType)}" style="max-width:100%;max-height:68vh;border-radius:6px;object-fit:contain">`
        }
      </div>
      <div class="bt" style="margin-top:14px">
        <button class="btn ok" onclick="downloadAttachment(${emp.id}, '${att.id}')">Baixar Arquivo</button>
        <button class="btn s" onclick="closeModal()">Fechar</button>
      </div>
    </div>
  </div>`;
}

function downloadAttachment(empId, attId) {
  const emp = STATE.employees.find(x => String(x.id) === String(empId));
  const att = emp?.attachments?.find(a => a.id === attId);
  if (!att) return;

  const a = document.createElement("a");
  a.href = att.dataUrl;
  const cleanEmp = emp.n.replace(/[^a-zA-Z0-9À-ÿ _-]/g, "").trim() || "Colaborador";
  const cleanType = att.docType.replace(/[^a-zA-Z0-9À-ÿ _-]/g, "").trim() || "Documento";
  const ext = att.mimeType === "application/pdf" ? "pdf" : "jpg";
  a.download = `${cleanEmp} - ${cleanType}.${ext}`;
  a.click();
  MotionFX.toast("Download do documento iniciado!");
}

async function deleteAttachment(empId, attId) {
  if (!IS_ADMIN) return;
  const emp = STATE.employees.find(x => String(x.id) === String(empId));
  if (!emp || !Array.isArray(emp.attachments)) return;
  if (!confirm("Excluir este documento anexado?")) return;

  emp.attachments = emp.attachments.filter(a => a.id !== attId);
  saveLocalCache();
  await syncSingleEmployeeToCloud(emp);
  go({ animate: false });
  MotionFX.toast("Documento anexado removido", "warn");
}

async function toggleDoc(empId, docIdx) {
  if (!IS_ADMIN) return;
  const emp = STATE.employees.find(x => String(x.id) === String(empId));
  if (emp) {
    emp.docs[docIdx] = !emp.docs[docIdx];
    saveLocalCache();
    await syncSingleEmployeeToCloud(emp);
    go({ animate: false });
    MotionFX.toast(emp.docs[docIdx] ? "Documento salvo e sincronizado!" : "Documento marcado como pendente", emp.docs[docIdx] ? "ok" : "warn");
  }
}

function ponto(allMetrics) {
  const f = STATE.employees.find(x => String(x.id) === String(E)) || STATE.employees[0];
  E = f.id;
  const d = allMetrics[f.id];
  const isMEI = f.regime === "MEI";
  const notas = d.rows.filter(r => r.obs && r.obs.trim() !== "");
  const hasBlankDays = d.rows.some(r => r.t === "—");

  return currentMonthHeaderHtml(IS_READ_ONLY ? "Espelho de jornada do mês vigente" : "Lançamento e conferência de jornada do mês vigente") + `

      <strong>Lançamentos de Horas:</strong>
    </div>

      ${hasBlankDays ? `<button class="mini-btn pri" onclick="fillStandardMonth(${f.id})">Preencher Dias Úteis</button>` : ""}

  </div>

  <div class="c">
    <div class="c-hd">
      <div>
        <h2>${isMEI ? "Registro de Atividades e Horas (MEI)" : "Espelho de Ponto (CLT)"} — ${formatMonthLabel(CURRENT_MONTH)}</h2>

    <div class="w">
      <table class="tn" id="point-table">

          </tr>

          ${d.rows.map(r => {
            const isPend = r.t === "Pendente";
            const isAbono = r.t === "Abonado" || r.t === "Folga Comp.";

  </div>
  `;
}

function getDefaultTimesForEmp(emp) {
  const ent = toMin(emp?.horaEntrada) ?? 480;
  const sai = toMin(emp?.horaSaida) ?? 1020;
  return [ent, 720, 780, sai];
}

async function quickFillDay(empId, day) {
  if (!IS_ADMIN) return;
  const emp = STATE.employees.find(x => String(x.id) === String(empId));
  const r = STATE.points[CURRENT_MONTH][empId]?.find(x => x.d === day);
  if (!r) return;
  const def = getDefaultTimesForEmp(emp);
  if (r.t === "Pendente" && r.p) {
    r.p = [r.p[0] ?? def[0], r.p[1] ?? def[1], r.p[2] ?? def[2], r.p[3] ?? def[3]];
  } else {
    r.p = [...def];
  }
  r.t = "Normal";
  saveLocalCache();
  await syncMonthPointsToCloud(CURRENT_MONTH);
  go({ animate: false });
  MotionFX.flashRows(`#point-table tr[data-day="${day}"]`);
  MotionFX.toast(`Dia ${String(day).padStart(2,"0")} preenchido e sincronizado!`);
}

async function fillStandardMonth(empId) {
  if (!IS_ADMIN) return;
  const emp = STATE.employees.find(x => String(x.id) === String(empId));
  const def = getDefaultTimesForEmp(emp);
  const rows = STATE.points[CURRENT_MONTH][empId] || [];
  const changedDays = [];
  rows.forEach(r => {
    if (r.t === "—") {
      r.t = "Normal";
      r.p = [...def];
      changedDays.push(r.d);
    }
  });
  saveLocalCache();
  await syncMonthPointsToCloud(CURRENT_MONTH);
  go({ animate: false });
  if (changedDays.length) {
    const sel = changedDays.map(d => `#point-table tr[data-day="${d}"]`).join(",");
    MotionFX.flashRows(sel);
    MotionFX.toast(`${changedDays.length} dias úteis preenchidos e sincronizados!`);
  }
}

async function clearMonthRows(empId) {
  if (!IS_ADMIN) return;
  if (!confirm("Zerar todos os lançamentos deste mês para este integrante?")) return;
  STATE.points[CURRENT_MONTH][empId] = generateMonthRows(empId, CURRENT_MONTH, false);
  saveLocalCache();
  await syncMonthPointsToCloud(CURRENT_MONTH);
  go({ animate: true });
  MotionFX.toast("Lançamentos do mês zerados", "warn");
}

    const circ = 2 * Math.PI * radius;
    const offset = circ - (Math.min(100, d.pctTeto) / 100) * circ;

    return currentMonthHeaderHtml("Demonstrativo financeiro vigente para emissão de NFS-e") + empSelector() + `

        </div>
        <span class="bd mei">Regime MEI (PJ)</span>

      <div class="w">
        <table>
          <tr><th colspan="2">Valores dos Serviços Prestados (Créditos)</th></tr>
          ${L(creditos)}
          <tr><th colspan="2">Deduções / Isenções Contratuais</th></tr>

      <p style="margin-top:14px;font-size:17px">

      <div class="mei-gauge-box">

function passados() {
  const pastList = getPreviousMonthsList();
  if (!pastList.includes(PAST_COMP)) {
    PAST_COMP = pastList[0] || "2026-10";
  }

  ensureMonthData(PAST_COMP);
  const pastMetrics = {};
  STATE.employees.forEach(emp => {
    pastMetrics[emp.id] = calcMetrics(emp, PAST_COMP);
  });

  const emps = STATE.employees;
  const totEx = emps.reduce((a, e) => a + pastMetrics[e.id].ex, 0);
  const totExVal = emps.reduce((a, e) => a + pastMetrics[e.id].exVal, 0);
  const totNg = emps.reduce((a, e) => a + pastMetrics[e.id].ng, 0);
  const totNgVal = emps.reduce((a, e) => a + pastMetrics[e.id].ngVal, 0);
  const totAjuda = emps.reduce((a, e) => a + pastMetrics[e.id].ajuda, 0);
  const totGeral = emps.reduce((a, e) => a + pastMetrics[e.id].liquido, 0);
  const totMEI = emps.filter(e => e.regime === "MEI").reduce((a, e) => a + pastMetrics[e.id].liquido, 0);
  const totCLT = emps.filter(e => e.regime !== "MEI").reduce((a, e) => a + pastMetrics[e.id].liquido, 0);
  const totOk = emps.reduce((a, e) => a + pastMetrics[e.id].ok, 0);
  const totPe = emps.reduce((a, e) => a + pastMetrics[e.id].pe, 0);
  const saldoGeral = totEx - totNg;

  const showFullReport = REPORT_GENERATED_FOR === PAST_COMP;

  const sectors = [...new Set(emps.map(e => e.s))];
  const sectorRows = sectors.map(s => {
    const grp = emps.filter(e => e.s === s);
    return {
      s,
      qtd: grp.length,
      ex: grp.reduce((a, e) => a + pastMetrics[e.id].ex, 0),
      exVal: grp.reduce((a, e) => a + pastMetrics[e.id].exVal, 0),
      ng: grp.reduce((a, e) => a + pastMetrics[e.id].ng, 0),
      ngVal: grp.reduce((a, e) => a + pastMetrics[e.id].ngVal, 0),
      total: grp.reduce((a, e) => a + pastMetrics[e.id].liquido, 0)
    };
  });

  const occurrences = [];
  emps.forEach(emp => {
    const m = pastMetrics[emp.id];
    m.rows.forEach(r => {
      if (r.t === "Falta" || r.t === "Abonado" || r.t === "Folga Comp." || r.t === "Pendente" || (r.obs && r.obs.trim() !== "")) {
        occurrences.push({
          nome: emp.n,
          regime: emp.regime,
          dia: String(r.d).padStart(2, "0"),
          sem: DS[r.w],
          tipo: r.t,
          obs: r.obs || "—"
        });
      }
    });
  });

  return `
  <div class="toolbar no-print">
    <div class="toolbar-grp">
      <strong>Histórico de Meses Passados:</strong>
      <select class="sel-sm" onchange="PAST_COMP=this.value;REPORT_GENERATED_FOR=null;go({animate:true})">
        ${pastList.map(k => `<option value="${k}" ${PAST_COMP === k ? "selected" : ""}>${formatMonthLabel(k)}</option>`).join("")}
      </select>
    </div>
    <div class="toolbar-grp">
      <button class="btn" style="flex:0 0 auto;padding:8px 16px" onclick="triggerMonthlyReport('${PAST_COMP}')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Gerar Relatório Mensal
      </button>
    </div>
  </div>

  ${!showFullReport ? `
    <div class="c">
      <div class="c-hd">
        <div>
          <h2>Competência Encerrada: ${formatMonthLabel(PAST_COMP)}</h2>
          <p class="m" style="margin:2px 0 0">Clique em <strong>"Gerar Relatório Mensal"</strong> para consolidar o dossiê completo de horas, valores e ocorrências deste mês.</p>
        </div>
        <span class="bd">Arquivo Histórico</span>
      </div>
      <div class="report-kpis" style="margin-top:12px;margin-bottom:0">
        <div class="rk"><small>Equipe no Mês</small><b>${emps.length} integrantes</b></div>
        <div class="rk"><small>Horas Extras Apuradas</small><b>${hm(totEx)}</b></div>
        <div class="rk"><small>Horas Negativas</small><b class="${totNg > 0 ? "neg" : ""}">${hm(totNg)}</b></div>
        <div class="rk"><small>Total Consolidado</small><b>${$$(totGeral)}</b></div>
      </div>
    </div>
  ` : `
    <div class="report-box" id="monthly-report-sheet">
      <div class="report-header">
        <div>
          <span class="bd" style="margin-bottom:6px">RELATÓRIO MENSAL CONSOLIDADO</span>
          <h2 style="font-size:19px;margin:2px 0">Fechamento Completo — ${formatMonthLabel(PAST_COMP)}</h2>
          <p class="m" style="margin:2px 0 0">Gerado em ${new Date().toLocaleDateString("pt-BR")} às ${new Date().toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"})} • PontoRH</p>
        </div>
        <div class="toolbar-grp no-print">
          <button class="mini-btn pri" onclick="window.print()">Imprimir / Salvar PDF</button>
          <button class="mini-btn" onclick="exportCSVForComp('${PAST_COMP}')">Exportar CSV</button>
        </div>
      </div>

      <div class="report-kpis">
        <div class="rk">
          <small>Total Geral Pago (NF + Folha)</small>
          <b>${$$(totGeral)}</b>
          <span style="font-size:11.5px;color:var(--mut)">MEI: ${$$(totMEI)}${totCLT > 0 ? ` • CLT: ${$$(totCLT)}` : ""}</span>
        </div>
        <div class="rk">
          <small>Horas Adicionais / Extras</small>
          <b class="pos">${hm(totEx)}</b>
          <span style="font-size:11.5px;color:var(--mut)">Valor adicional: +${$$(totExVal)}</span>
        </div>
        <div class="rk">
          <small>Horas Não Prestadas</small>
          <b class="${totNg > 0 ? "neg" : ""}">${hm(totNg)}</b>
          <span style="font-size:11.5px;color:var(--mut)">Abatimentos: -${$$(totNgVal)}</span>
        </div>
        <div class="rk">
          <small>Saldo Banco & Integridade</small>
          <b class="${saldoGeral >= 0 ? "pos" : "neg"}">${saldoGeral > 0 ? "+" : ""}${hm(saldoGeral)}</b>
          <span style="font-size:11.5px;color:var(--mut)">${totOk} dias validados • ${totPe} pend.</span>
        </div>
      </div>

      <div class="ficha-sec-title">1. Resumo Financeiro e Operacional por Setor</div>
      <div class="w" style="margin-bottom:18px">
        <table>
          <thead>
            <tr>
              <th>Setor</th>
              <th class="n">Qtd.</th>
              <th class="n">Horas Extras</th>
              <th class="n">Valor Extras</th>
              <th class="n">Horas Negativas</th>
              <th class="n">Abatimentos</th>
              <th class="n">Total Setor</th>
            </tr>
          </thead>
          <tbody>
            ${sectorRows.map(sr => `
              <tr>
                <td><strong>${escHtml(sr.s)}</strong></td>
                <td class="n">${sr.qtd}</td>
                <td class="n">${hm(sr.ex)}</td>
                <td class="n pos">+${$$(sr.exVal)}</td>
                <td class="n ${sr.ng > 0 ? "neg" : ""}">${hm(sr.ng)}</td>
                <td class="n">-${$$(sr.ngVal)}</td>
                <td class="n"><strong>${$$(sr.total)}</strong></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>

      <div class="ficha-sec-title">2. Detalhamento Individual por Colaborador / Prestador MEI</div>
      <div class="w" style="margin-bottom:18px">
        <table>
          <thead>
            <tr>
              <th>Nome / Cargo</th>
              <th>Regime</th>
              <th>CNPJ / CPF</th>
              <th class="n">Dias OK</th>
              <th class="n">Base</th>
              <th class="n">Extras (h / R$)</th>
              <th class="n">Negativas</th>
              <th class="n">Ajuda Custo</th>
              <th class="n">Valor Final / NF</th>
            </tr>
          </thead>
          <tbody>
            ${emps.map(emp => {
              const m = pastMetrics[emp.id];
              return `
                <tr>
                  <td><strong>${escHtml(emp.n)}</strong><br><span style="font-size:11.5px;color:var(--mut)">${escHtml(emp.c)} • ${escHtml(emp.s)}</span></td>
                  <td><span class="bd ${emp.regime === "MEI" ? "mei" : ""}">${escHtml(emp.regime)}</span></td>
                  <td>${emp.regime === "MEI" ? escHtml(emp.cnpjMei || "—") : escHtml(emp.cpf)}</td>
                  <td class="n">${m.ok}</td>
                  <td class="n">${$$(emp.sal)}</td>
                  <td class="n">${hm(m.ex)} (+${$$(m.exVal)})</td>
                  <td class="n ${m.ng > 0 ? "neg" : ""}">${hm(m.ng)} (-${$$(m.ngVal)})</td>
                  <td class="n">${$$(m.ajuda)}</td>
                  <td class="n"><strong>${$$(m.liquido)}</strong></td>
                </tr>
              `;
            }).join("")}
            <tr style="background:var(--sub);font-weight:700">
              <td colspan="4">TOTAL CONSOLIDADO (${formatMonthLabel(PAST_COMP).toUpperCase()})</td>
              <td class="n">${$$(emps.reduce((a,e)=>a+e.sal,0))}</td>
              <td class="n">${hm(totEx)} (+${$$(totExVal)})</td>
              <td class="n">${hm(totNg)} (-${$$(totNgVal)})</td>
              <td class="n">${$$(totAjuda)}</td>
              <td class="n">${$$(totGeral)}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="ficha-sec-title">3. Ocorrências, Abonos e Observações do Período (${occurrences.length})</div>
      ${occurrences.length === 0
        ? `<p class="m">Nenhuma ausência, abono ou pendência registrada nesta competência.</p>`
        : `<div class="w">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Colaborador</th>
                  <th>Regime</th>
                  <th>Ocorrência</th>
                  <th>Observação</th>
                </tr>
              </thead>
              <tbody>
                ${occurrences.map(o => `
                  <tr>
                    <td><strong>Dia ${o.dia}</strong> (${o.sem})</td>
                    <td>${escHtml(o.nome)}</td>
                    <td>${escHtml(o.regime)}</td>
                    <td><span class="bd ${o.tipo === "Falta" || o.tipo === "Pendente" ? "pe" : ""}">${escHtml(o.tipo)}</span></td>
                    <td>${escHtml(o.obs)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`
      }

      <div class="sg">
        <span>Responsável RH / Departamento Pessoal</span>
        <span>Diretoria / Aprovação Financeira</span>
      </div>
    </div>
  `}
  `;
}

async function savePointEdit(empId, day) {
  if (!IS_ADMIN) return;
  const r = STATE.points[CURRENT_MONTH][empId].find(x => x.d === day);
  const st = $("#pt-status").value;
  r.obs = $("#pt-obs").value.trim();
  if (st === "Normal") {
    const e = toMin($("#pt-e").value), a = toMin($("#pt-a").value), v = toMin($("#pt-v").value), s = toMin($("#pt-s").value);
    r.p = [e, a, v, s];
    r.t = (e != null && a != null && v != null && s != null) ? "Normal" : "Pendente";
  } else {
    r.t = st; r.p = null;
  }
  saveLocalCache();
  await syncMonthPointsToCloud(CURRENT_MONTH);
  closeModal();
  go({ animate: false });
  MotionFX.flashRows(`#point-table tr[data-day="${day}"]`);
  MotionFX.toast(`Dia ${String(day).padStart(2,"0")} salvo e sincronizado!`);
}

async function saveEmp(empId) {
  if (!IS_ADMIN) return;
  const nome = $("#em-n").value.trim();
  if (!nome) return alert("Informe o nome completo.");
  const regime = $("#em-reg").value;

  const data = {
    n: nome,
    nasc: $("#em-nasc").value || "",
    estadoCivil: $("#em-ec").value.trim(),
    nacionalidade: $("#em-nac").value.trim(),
    naturalidade: $("#em-nat").value.trim(),
    cpf: $("#em-cpf").value.trim(),
    rg: $("#em-rg").value.trim(),
    cnh: $("#em-cnh").value.trim(),
    cnhCat: $("#em-cnhcat").value.trim(),
    tel: $("#em-tel").value.trim(),
    email: $("#em-email").value.trim(),
    endereco: $("#em-end").value.trim(),
    numero: $("#em-num").value.trim(),
    complemento: $("#em-comp").value.trim(),
    bairro: $("#em-bairro").value.trim(),
    cep: $("#em-cep").value.trim(),
    cidade: $("#em-cidade").value.trim(),
    uf: $("#em-uf").value.trim().toUpperCase(),
    regime,
    status: $("#em-st").value,
    c: $("#em-c").value.trim() || "Colaborador",
    s: $("#em-s").value.trim() || "Geral",
    ad: $("#em-ad").value || new Date().toISOString().slice(0, 10),
    sal: parseFloat($("#em-sal").value) || 1518,
    jornada: $("#em-jornada").value.trim(),
    horaEntrada: $("#em-hent").value || "08:00",
    horaSaida: $("#em-hsai").value || "17:00",
    cnpjMei: $("#em-cnpj").value.trim(),
    fatorHe: parseFloat($("#em-fator").value) || 1.0,
    ajudaCusto: parseFloat($("#em-ajuda").value) || 0,
    acumAnual: parseFloat($("#em-acum").value) || 0,
    dep: parseInt($("#em-dep").value) || 0,
    vt: parseInt($("#em-vt").value) || 0,
    banco: $("#em-banco").value.trim(),
    pix: $("#em-pix").value.trim(),
    emergNome: $("#em-em-nome").value.trim(),
    emergParentesco: $("#em-em-par").value.trim(),
    emergTel: $("#em-em-tel").value.trim()
  };

  let targetEmp;
  if (empId != null) {
    const idx = STATE.employees.findIndex(x => String(x.id) === String(empId));
    if (idx >= 0) {
      const existing = STATE.employees[idx];
      targetEmp = {
        ...existing,
        ...data,
        docs: Array.isArray(existing.docs) ? [...existing.docs] : [false, false, false, false, false],
        attachments: Array.isArray(existing.attachments) ? existing.attachments.map(a => ({ ...a })) : []
      };
      STATE.employees[idx] = targetEmp;
    }
  } else {
    targetEmp = createIsolatedEmployee(
      {
        ...data,
        docs: [false, false, false, false, false],
        attachments: []
      },
      STATE.employees
    );
    STATE.employees.push(targetEmp);
    E = targetEmp.id;
    UI.expandedTeamCards.add(String(targetEmp.id));
    ensureMonthData(CURRENT_MONTH);
  }

  saveLocalCache();
  closeModal();
  go({ animate: true });
  if (targetEmp) {
    await syncSingleEmployeeToCloud(targetEmp);
    if (empId == null) await syncMonthPointsToCloud(CURRENT_MONTH);
  }
  MotionFX.toast(empId != null ? "Ficha atualizada e sincronizada!" : "Novo colaborador cadastrado e sincronizado!");
}

async function deleteEmp(empId) {
  if (!IS_ADMIN) return;
  if (!confirm("Excluir este cadastro?")) return;
  const target = STATE.employees.find(x => String(x.id) === String(empId));
  STATE.employees = STATE.employees.filter(x => String(x.id) !== String(empId));
  UI.expandedTeamCards.delete(String(empId));
  E = STATE.employees[0]?.id || 1;
  saveLocalCache();
  closeModal();
  go({ animate: true });
  if (target?.uid) {
    await deleteSingleEmployeeFromCloud(target.uid);
  }
  MotionFX.toast("Cadastro removido e sincronizado", "warn");
}

function handleSidebarImport(ev) {
  if (!IS_ADMIN) return;
  const file = ev.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = normalizeStateShape(JSON.parse(e.target.result));
      if (!parsed || !parsed.employees || !parsed.points) {
        alert("Arquivo JSON inválido. Selecione um arquivo de backup do PontoRH.");

      }

      <div class="modal-bg" onclick="if(event.target===this)closeModal()">
        <div class="modal">
