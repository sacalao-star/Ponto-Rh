          <div class="bt" style="flex-direction:column;margin-top:14px">
            <button class="btn ok" onclick="confirmPendingImport('merge')">Mesclar com os Dados Atuais (Recomendado)</button>
            <button class="btn" onclick="confirmPendingImport('replace')">Substituir Tudo pelo Backup</button>
            <button class="btn s" onclick="PENDING_IMPORT_PARSED=null;closeModal()">Cancelar</button>

        </div>
      </div>`;
    } catch (_) {
      alert("Erro ao ler o arquivo JSON.");
    } finally {
      ev.target.value = "";
    }
  };
  reader.readAsText(file);
}

async function applyMergeIncomingState(incoming) {
  const idMap = {};
  let addedCount = 0;
  let updatedCount = 0;

  incoming.employees.forEach(incEmp => {
    const cleanCpf = String(incEmp.cpf || "").replace(/\D/g, "");
    const cleanName = String(incEmp.n || "").trim().toLowerCase();
    const existing = STATE.employees.find(cur =>
      (incEmp.uid && cur.uid === incEmp.uid) ||
      (cleanCpf.length >= 11 && String(cur.cpf || "").replace(/\D/g, "") === cleanCpf) ||
      (cleanName && String(cur.n || "").trim().toLowerCase() === cleanName)
    );

    if (existing) {
      idMap[incEmp.id] = existing.id;
      Object.keys(incEmp).forEach(k => {
        if (["id", "uid", "docs", "attachments"].includes(k)) return;
        const curVal = existing[k];
        const incVal = incEmp[k];
        if ((curVal === "" || curVal == null) && incVal !== "" && incVal != null) {
          existing[k] = incVal;
        }
      });
      if (Array.isArray(incEmp.docs)) {
        existing.docs = (existing.docs || []).map((v, idx) => Boolean(v || incEmp.docs[idx]));
      }
      if (Array.isArray(incEmp.attachments) && incEmp.attachments.length > 0) {
        const existingAttIds = new Set((existing.attachments || []).map(a => a.id));
        if (!Array.isArray(existing.attachments)) existing.attachments = [];
        incEmp.attachments.forEach(att => {
          if (!existingAttIds.has(att.id)) {
            existing.attachments.push({ ...att });
          }
        });
      }
      updatedCount++;
    } else {
      const isolated = createIsolatedEmployee(
        { ...incEmp, id: undefined },
        STATE.employees
      );
      STATE.employees.push(isolated);
      idMap[incEmp.id] = isolated.id;
      addedCount++;
    }
  });

  Object.keys(incoming.points || {}).forEach(comp => {
    if (!STATE.points[comp]) STATE.points[comp] = {};
    const compObj = incoming.points[comp] || {};
    Object.keys(compObj).forEach(oldId => {
      const mappedId = idMap[oldId] != null ? idMap[oldId] : oldId;
      const incRows = compObj[oldId];
      if (!Array.isArray(incRows)) return;

      if (!Array.isArray(STATE.points[comp][mappedId])) {
        STATE.points[comp][mappedId] = incRows.map(r => ({ ...r, p: r.p ? [...r.p] : r.p }));
      } else {
        const curRows = STATE.points[comp][mappedId];
        incRows.forEach(ir => {
          const cr = curRows.find(x => x.d === ir.d);
          if (!cr) {
            curRows.push({ ...ir, p: ir.p ? [...ir.p] : ir.p });
          } else if ((cr.t === "—" || cr.t === "Pendente") && ir.t && ir.t !== "—") {
            cr.t = ir.t;
            cr.p = ir.p ? [...ir.p] : null;
            if (ir.obs && !cr.obs) cr.obs = ir.obs;
          }
        });
      }
    });
  });

  if (!STATE.employees.some(x => String(x.id) === String(E))) {
    E = STATE.employees[0]?.id || 1;
  }

  closeModal();
  go({ animate: true });
  await syncAllToCloud();
  MotionFX.toast(`Mesclado: +${addedCount} novo(s), ${updatedCount} atualizado(s)!`);
}

async function confirmPendingImport(mode) {
  if (!IS_ADMIN || !PENDING_IMPORT_PARSED) return;
  const incoming = PENDING_IMPORT_PARSED;
  PENDING_IMPORT_PARSED = null;

  if (mode === "replace") {
    STATE = incoming;
    E = STATE.employees[0]?.id || 1;
    closeModal();
    go({ animate: true });
    await syncAllToCloud();
    MotionFX.toast("Backup restaurado e sincronizado na nuvem!");
  } else {
    await applyMergeIncomingState(incoming);
  }
}

function mergeBackup(ev) {
  if (!IS_ADMIN) return;
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const incoming = normalizeStateShape(JSON.parse(e.target.result));
      if (!incoming || !incoming.employees || !incoming.points) {
        alert("Arquivo JSON inválido.");
        return;
      }
      applyMergeIncomingState(incoming);
    } catch (err) {
      alert("Erro ao mesclar o arquivo JSON.");
    }
  };
  reader.readAsText(file);
}

function importBackup(ev) {
  if (!IS_ADMIN) return;
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const parsed = normalizeStateShape(JSON.parse(e.target.result));
      if (parsed && parsed.employees && parsed.points) {
        STATE = parsed;
        E = STATE.employees[0]?.id || 1;
        closeModal();
        go({ animate: true });
        await syncAllToCloud();
        MotionFX.toast("Backup restaurado e sincronizado na nuvem!");
      } else alert("Arquivo inválido.");
    } catch (err) { alert("Erro ao ler JSON."); }
  };
  reader.readAsText(file);
}

function exportCSVForComp(comp) {
  ensureMonthData(comp);
  const header = ["Competencia","Nome","Regime","CNPJ_MEI","CPF","Banco","Chave_PIX","Setor","Cargo","Valor_Base","Horas_Adicionais","Valor_Adicional","Horas_Negativas","Desconto_Horas","Ajuda_Custo","INSS","IRRF","Valor_Liquido_NF"];
  const lines = [header.join(";")];

  STATE.employees.forEach(emp => {
    const m = calcMetrics(emp, comp);
    lines.push([
      comp, `"${emp.n}"`, emp.regime, `"${emp.cnpjMei || ""}"`, `"${emp.cpf || ""}"`, `"${emp.banco || ""}"`, `"${emp.pix || ""}"`, `"${emp.s}"`, `"${emp.c}"`,
      emp.sal.toFixed(2).replace(".",","), hm(m.ex), m.exVal.toFixed(2).replace(".",","),
      hm(m.ng), m.ngVal.toFixed(2).replace(".",","), m.ajuda.toFixed(2).replace(".",","),
      m.inss.toFixed(2).replace(".",","), m.irrf.toFixed(2).replace(".",","),
      m.liquido.toFixed(2).replace(".",",")
    ].join(";"));
  });

  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Relatorio-PontoRH-${comp}.csv`;
  a.click();
  MotionFX.toast(`Planilha ${comp}.csv exportada!`);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  const icon = $("#theme-icon");
  const lbl = $("#theme-label");
  if (lbl) {
    lbl.textContent = next === "dark" ? "Tema (Escuro)" : "Tema (Claro)";
  }
  if (icon) {
    icon.style.transition = "transform .35s cubic-bezier(.34,1.56,.64,1)";
    icon.style.transform = next === "dark" ? "rotate(180deg) scale(1.1)" : "rotate(0deg) scale(1)";
  }
}

  set PAST_COMP(v) { PAST_COMP = v; },
  get PAST_COMP() { return PAST_COMP; },
  set REPORT_GENERATED_FOR(v) { REPORT_GENERATED_FOR = v; },
  get REPORT_GENERATED_FOR() { return REPORT_GENERATED_FOR; },
  set E(v) { E = v; },
  get E() { return E; }
});

window.addEventListener("resize", () => MotionFX.updateNavInk());

// =========================================================
// 7. INICIALIZAÇÃO IMEDIATA (ESPECTADOR DIRETO + SESSÃO ADMIN)
// =========================================================
const savedNav = loadNavState();
if (savedNav) {
  if (savedNav.V && ["painel", "equipe", "ponto", "holerite", "passados"].includes(savedNav.V)) {
    V = savedNav.V;
  }
  if (savedNav.E && STATE.employees.some(x => String(x.id) === String(savedNav.E))) {
    E = savedNav.E;
  }
  if (savedNav.PAST_COMP) PAST_COMP = savedNav.PAST_COMP;
}

// Inicia imediatamente em modo Espectador (ou Admin se já autenticado)
setAccessMode({ isAdmin: false });
go({ animate: false });
connectUnifiedCloudListeners();
setTimeout(hideSplashScreen, 1200);

if (firebaseAuth) {
  onAuthStateChanged(firebaseAuth, async (user) => {
    if (user && !user.isAnonymous) {
      const email = (user.email || "").toLowerCase();
      if (isEmailAuthorizedAdmin(email)) {
        setAccessMode({ isAdmin: true, email });
        go({ animate: false });
        return;
      } else {
        await signOut(firebaseAuth);
        setAccessMode({ isAdmin: false });
        go({ animate: false });
        MotionFX.toast(`E-mail "${email}" sem permissão administrativa.`, "warn");
        return;
      }
    }
    setAccessMode({ isAdmin: false });
    go({ animate: false });
  });
}
</script>
</body>
</html>
